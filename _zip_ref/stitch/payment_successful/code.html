<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-300">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top Navigation / Close -->
<div class="flex items-center p-4 justify-between sticky top-0 z-50">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined">close</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Payment Status</h2>
</div>
<div class="flex-1 flex flex-col items-center px-4 pb-12">
<!-- Success Animation Area -->
<div class="relative flex flex-col items-center justify-center py-10 w-full overflow-hidden">
<!-- Static Confetti Elements (Visual Representation) -->
<div class="absolute top-10 left-1/4 w-3 h-3 rounded-full bg-cyan-400 opacity-60"></div>
<div class="absolute top-20 right-1/4 w-2 h-4 rounded-full bg-purple-500 opacity-60 rotate-45"></div>
<div class="absolute bottom-10 left-1/3 w-4 h-2 rounded-full bg-pink-500 opacity-60 -rotate-12"></div>
<div class="absolute top-1/2 right-10 w-3 h-3 rounded-full bg-primary opacity-40"></div>
<!-- Main Checkmark Circle -->
<div class="relative z-10 flex items-center justify-center w-[120px] h-[120px] rounded-full bg-gradient-to-br from-emerald-300 to-cyan-500 shadow-xl shadow-emerald-500/20">
<span class="material-symbols-outlined text-white text-[72px] font-bold">check</span>
</div>
</div>
<!-- Elevated Glassmorphic Summary Card -->
<div class="w-full max-w-md bg-white/70 dark:bg-white/5 backdrop-blur-xl border border-white/40 dark:border-white/10 rounded-3xl shadow-2xl p-6 mb-8">
<div class="text-center mb-6">
<h1 class="text-slate-900 dark:text-slate-100 text-2xl font-bold mb-2">Payment Successful</h1>
<p class="text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100" style="font-family: monospace;">₹10,000</p>
</div>
<!-- Security Badge -->
<div class="flex items-center justify-center mb-8">
<div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300 text-sm font-medium border border-purple-200 dark:border-purple-800">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span>Secured by 47 patterns</span>
</div>
</div>
<!-- Details List -->
<div class="space-y-6">
<!-- Merchant -->
<div class="flex items-center justify-between">
<span class="text-slate-500 dark:text-slate-400 text-sm">Merchant</span>
<div class="flex items-center gap-3">
<p class="text-slate-900 dark:text-slate-100 font-semibold text-sm">Sharma Electronics</p>
<div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center overflow-hidden border border-primary/20">
<img class="w-full h-full object-cover" data-alt="Avatar of Sharma Electronics shop logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHfBWTMuhCwaUlungITbdHrzuolbrFj_D0e17L3cQ9SuoBd8cPwTZroRGPZnCKeigAGVwwyem9kL9T6hno2ACwlP4t-RM90LhnA4gsRvL26lzZDxJ_DHNGoIikQ8V8zljJKTuvg3KAMZyDZNkcro8OENipBKkvQohuCQcRAZtQhcefxTyjG-wTXCR0MDwIqTlHMtPk6YnsvxzPWc0nkCW2vbfmAPq4QlIX8q_eie7PoOSlBl-tjXHUCf8lXUj6bdMoVNwa6EaIpEM"/>
</div>
</div>
</div>
<!-- Date -->
<div class="flex items-center justify-between">
<span class="text-slate-500 dark:text-slate-400 text-sm">Date</span>
<p class="text-slate-900 dark:text-slate-100 font-medium text-sm">Today, 2:34 PM</p>
</div>
<!-- Transaction ID -->
<div class="flex items-center justify-between">
<span class="text-slate-500 dark:text-slate-400 text-sm">Transaction ID</span>
<div class="flex items-center gap-2">
<p class="text-slate-900 dark:text-slate-100 font-medium text-sm">TXN834729472</p>
<button class="text-primary hover:text-primary/80 transition-colors">
<span class="material-symbols-outlined text-lg">content_copy</span>
</button>
</div>
</div>
<!-- Payment Method -->
<div class="flex items-center justify-between border-t border-slate-200 dark:border-slate-800 pt-6">
<span class="text-slate-500 dark:text-slate-400 text-sm">Payment Method</span>
<div class="flex items-center gap-2">
<div class="w-6 h-4 bg-slate-200 dark:bg-slate-700 rounded-sm flex items-center justify-center text-[8px] font-bold text-slate-500 uppercase tracking-tighter">UPI</div>
<p class="text-slate-900 dark:text-slate-100 font-medium text-sm">UPI ••••4521</p>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-md space-y-4">
<button class="w-full h-14 bg-primary text-white font-bold rounded-2xl shadow-lg shadow-primary/25 hover:opacity-90 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">download</span>
                    Download Receipt
                </button>
<button class="w-full h-14 bg-transparent border-2 border-primary/30 text-primary font-bold rounded-2xl hover:bg-primary/5 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">share</span>
                    Share Payment
                </button>
<div class="pt-4 text-center">
<a class="text-slate-400 dark:text-slate-500 hover:text-primary transition-colors font-medium text-sm flex items-center justify-center gap-1" href="#">
                        Done
                        <span class="material-symbols-outlined text-sm">chevron_right</span>
</a>
</div>
</div>
</div>
<!-- Footer Visual Spacer -->
<div class="h-8 w-full bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
