<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Secure Payment Verification</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#0f0714",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"],
                        "mono": ["SF Mono", "ui-monospace", "monospace"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glow-purple { filter: drop-shadow(0 0 4px #a855f7); }
        .glow-cyan { filter: drop-shadow(0 0 4px #06b6d4); }
        .glow-pink { filter: drop-shadow(0 0 4px #ec4899); }
        .glow-yellow { filter: drop-shadow(0 0 4px #eab308); }
        .bg-gradient-mesh {
            background: radial-gradient(circle at 20% 20%, rgba(88, 28, 135, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(8, 145, 178, 0.15) 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-hidden">
<div class="fixed inset-0 bg-gradient-mesh pointer-events-none"></div>
<div class="relative flex h-full min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="flex items-center p-4 pb-2 justify-between z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-800 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center">Secure Payment</h2>
<div class="size-12"></div>
</div>
<div class="flex-1 flex flex-col items-center justify-center p-6 relative">
<div class="relative w-72 h-72 flex items-center justify-center">
<div class="absolute inset-0 border-4 border-slate-200 dark:border-slate-800 rounded-full opacity-20"></div>
<div class="absolute inset-0 border-4 border-primary border-t-transparent rounded-full rotate-45"></div>
<div class="relative w-32 h-64 border-2 border-slate-400 dark:border-slate-600 rounded-3xl p-2 flex flex-col items-center justify-center opacity-80 rotate-12">
<div class="w-full h-full border border-slate-500/30 rounded-2xl flex flex-col items-center justify-center bg-slate-100/5 dark:bg-slate-900/10">
<span class="material-symbols-outlined text-4xl text-primary opacity-50">fingerprint</span>
</div>
</div>
<div class="absolute inset-0 flex items-center justify-center">
<div class="absolute w-2 h-2 rounded-full bg-purple-500 glow-purple translate-x-24 -translate-y-12"></div>
<div class="absolute w-2 h-2 rounded-full bg-purple-500 glow-purple -translate-x-20 translate-y-8"></div>
<div class="absolute w-1.5 h-1.5 rounded-full bg-purple-500 glow-purple translate-x-16 translate-y-24"></div>
<div class="absolute w-2 h-2 rounded-full bg-cyan-500 glow-cyan -translate-x-28 -translate-y-4"></div>
<div class="absolute w-2 h-2 rounded-full bg-cyan-500 glow-cyan translate-x-12 -translate-y-28"></div>
<div class="absolute w-1.5 h-1.5 rounded-full bg-cyan-500 glow-cyan -translate-x-10 translate-y-32"></div>
<div class="absolute w-2 h-2 rounded-full bg-pink-500 glow-pink translate-x-32 translate-y-4"></div>
<div class="absolute w-1.5 h-1.5 rounded-full bg-pink-500 glow-pink -translate-x-24 -translate-y-20"></div>
<div class="absolute w-2 h-2 rounded-full bg-yellow-500 glow-yellow -translate-x-4 -translate-y-32"></div>
<div class="absolute w-1.5 h-1.5 rounded-full bg-yellow-500 glow-yellow translate-x-28 translate-y-16"></div>
</div>
<div class="absolute inset-0 opacity-10">
<svg class="w-full h-full" viewbox="0 0 100 100">
<line stroke="currentColor" stroke-width="0.2" x1="20" x2="80" y1="20" y2="80"></line>
<line stroke="currentColor" stroke-width="0.2" x1="80" x2="20" y1="20" y2="80"></line>
<circle cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="2 2" stroke-width="0.1"></circle>
</svg>
</div>
</div>
<div class="mt-12 text-center w-full max-w-sm">
<div class="flex justify-between items-end mb-2">
<span class="text-slate-900 dark:text-slate-100 font-bold text-xl">Verifying Payment</span>
<span class="text-primary font-mono font-bold text-lg">47%</span>
</div>
<div class="h-1.5 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden mb-4">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 47%;"></div>
</div>
<div class="space-y-1">
<p class="text-slate-600 dark:text-slate-400 text-sm font-medium animate-pulse">Checking behavioral patterns...</p>
<p class="text-slate-400 dark:text-slate-500 text-xs">Validating merchant trust score...</p>
<p class="text-slate-400 dark:text-slate-500 text-xs opacity-50">Processing payment...</p>
</div>
</div>
</div>
<div class="p-8 flex flex-col items-center gap-6">
<div class="flex gap-4 items-center justify-center">
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-purple-500"></div>
<span class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Physical</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-cyan-500"></div>
<span class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Temporal</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-pink-500"></div>
<span class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Spatial</span>
</div>
<div class="flex items-center gap-1.5">
<div class="w-2 h-2 rounded-full bg-yellow-500"></div>
<span class="text-[10px] font-mono uppercase tracking-wider text-slate-500">Cognitive</span>
</div>
</div>
<button class="text-red-500 hover:text-red-600 font-medium text-sm transition-colors duration-300">
                Cancel Payment
            </button>
<p class="text-slate-400 dark:text-slate-600 text-[10px] text-center max-w-[200px]">
                Biometric behavioral data is encrypted and never stored on servers.
            </p>
</div>
</div>
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-cyan-500 to-primary opacity-30"></div>
</body></html>
