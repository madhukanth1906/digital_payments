name: flexpay_app
description: FlexPay behavioral biometric payments app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.0
  riverpod: ^2.4.0
  get: ^4.6.6
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  flutter_staggered_animations: ^1.1.1
  glass_kit: ^3.0.0
  gradient_borders: ^1.0.0
  go_router: ^13.2.0
  auto_route: ^7.8.0
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  sensors_plus: ^4.0.2
  geolocator: ^11.0.0
  local_auth: ^2.1.8
  device_info_plus: ^9.1.0
  tflite_flutter: ^0.12.1
  razorpay_flutter: ^1.3.6
  mobile_scanner: ^3.5.5
  qr_flutter: ^4.1.0
  intl: ^0.18.1
  collection: ^1.18.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  share_plus: ^7.2.1
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  retrofit_generator: ^8.0.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/lottie/
